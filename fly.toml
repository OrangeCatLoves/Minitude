# Fly.io settings for Minitude. Steps and explanations: docs/DEPLOY.md
#
# Fly app names are shared by everybody. If "minitude" is taken, `fly launch --no-deploy --copy-config` asks for another
# name and rewrites the next line.
app = "minitude-lwb"
primary_region = "sin"

[build]
  # uses the Dockerfile in this folder

[env]
  NODE_ENV = "production"
  PORT = "8787"
  # the database lives on the volume (see [[mounts]]), so it survives deploys and restarts
  DATABASE_FILE = "/data/minitude.db"
  # a copy of the database every day on the same volume; only the newest 3 are kept (each copy is as big as the database, 105 MB in Nov 2026,
  # on a 1 GB volume; Fly also snapshots the whole volume every day and keeps 5 days of them). Copies made by hand with `db backup` are
  # pruned by the same job: the newest 2 stay (`KEEP_MANUAL` in src/backup.ts)
  BACKUP_DIR = "/data/backups"
  BACKUP_KEEP = "3"
  # Fly's front door puts the visitor's address in this header (the server needs it to limit daily runs per network)
  CLIENT_IP_HEADER = "fly-client-ip"
  # Limits that keep one small machine safe from a script. They are tuned for a NEW game with few players; raise them as it grows (and raise
  # the machine and the volume with them). Not set here = the defaults in the comments. 0 switches a limit off. See docs/SECURITY.md, "When you scale".
  #   MAX_RUNS_PER_DAY = "20000"              new solo games a day, whole server
  #   MAX_RUNS_PER_NETWORK_PER_DAY = "300"    new solo games a day from one network (a school shares one)
  #   DAILY_PER_IP = "10"                     Daily runs a day from one network
  #   RATE_LIMIT_PER_MINUTE = "90"            requests a minute from one network (start / miss / abandon: 3 times that)
  # the answer checker's model. Your local packages/server/.env sets this, but Fly never sees that file; without this line the server would
  # use the code default (gemini-3.8-flash), which the free tier limits to 20 requests a day. The live trial found this one fast (about 1.2 s).
  LLM_MODEL = "gemini-3.5-flash-lite"
  # secrets are NOT written here: use `fly secrets set GEMINI_API_KEY=...`

[[mounts]]
  source = "minitude_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # SQLite lives on one machine's disk: exactly one machine, always on
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB since 16 Nov 2026 (the owner agreed, about $2 a month more in Singapore). The server itself uses about 100 MB, but the machine
  # has no swap and a bank import (`questions import`, about 105 MB) runs next to it over `fly ssh`: on 256 MB (215 MB usable) that left
  # almost no margin. If you change this with `fly scale memory`, change it here too, or the next deploy puts it back.
  memory = "512mb"
